@if (selected) {
  <app-book-detail [bookDetail]="selectedBook"></app-book-detail>
}

<hr />

<div class="container-fluid">
  <div class="row">
      @for (b of books; track b.name) {
        <div class="col mb-2">
          <div class="card p-2" style="width: 15rem; height: 33rem">
            <img
              class="card-img-top"
              src="{{ b.image }}"
              alt="{{ b.name }}"
              (click)="onSelected(b)"
            />
            <div class="card-body">
              <h5 class="card-title">{{ b.name }}</h5>
              <p class="card-text">[{{ b.editorial.name }}]</p>
            </div>
          </div>
        </div>
      }
  </div>
</div>
